Tables are created using:
<table> – table container
<tr> – row
<th> – header cell
<td> – data cell
Attributes include:
border – adds border
rowspan – merges cells vertically
colspan – merges cells horizontally
PROGRAM:
<!DOCTYPE html>
<html>
<head>
    <title>Table Example</title>
</head>
<body>
<table border="1">
    <tr>
        <th rowspan="2">Name</th>
        <th colspan="3">Marks</th>
    </tr>
    
        <th>Science</th>
        <th>English</th>
    </tr>
    <tr>
        <td>STUDENT1</td>
        <td>90</td>
        <td>85</td>
        <td>88</td>
    </tr>
    <tr>
        <td>STUDENT2</td>
        <td>78</td>
        <td>92</td>
        <td>81</td>
    </tr></table></body></html>
