<!DOCTYPE html>
<html>
<head>
    <title>HTML Lists Example</title>
</head>
<body>

<h2>Ordered List</h2>
<ol>
    <li>Apple</li>
    <li>Banana</li>
    <li>Mango</li>
</ol>

<h2>Unordered List</h2>
<ul>
    <li>Red</li>
    <li>Green</li>
    <li>Blue</li>
</ul>

<h2>Nested List</h2>
<ul>
    <li>Languages
        <ol>
            <li>C</li>
            <li>Java</li>
            <li>Python</li>
        </ol>
    </li>
</ul>

<h2>Ordered List inside Unordered List</h2>
<ul>
    <li>Courses
        <ol>
            <li>B.Tech</li>
            <li>M.Tech</li>
        </ol>
    </li>
</ul>

<h2>Definition List</h2>
<dl>
    <dt>HTML</dt>
    <dd>HyperText Markup Language</dd>
</dl>

</body>
</html>
